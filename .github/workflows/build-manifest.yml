name: Build docs manifest

on:
  push:
    branches: [main]
    paths:
      - 'docs/**.md'
      - 'config-docs.js'
      - 'generate-manifest.js'
      - 'doc-links.js'
      - 'tests/**'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: shani8dev/shani-ci-commons/.github/workflows/build.yml@main
    with:
      build-type: manifest

  # `build` only proves the generator completes; nothing validated the content it
  # emitted. Do not add a "generated output is stale" check or a commit step
  # here: `build` auto-commits regenerated stubs, so either would race it.
  validate:
    name: Content validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate stubs
        run: node generate-manifest.js

      - name: Unit tests
        run: node --test tests/*.test.js

      - name: Broken internal link check
        run: node tests/check-links.js

      # Well-formedness of the GENERATED pages: html5lib parse errors, stray
      # control characters (the `\x00BLOCKnn\x00` placeholder leak), duplicate
      # titles, and pages with no title. Added 2026-10-05: the committed tree
      # carried 45 parse errors and 68 NUL bytes across 3 pages, all live on
      # docs.shani.dev, and neither the generator nor check-links.js looked at
      # whether the emitted HTML was valid. Needs html5lib, which is not in
      # this job's Node-only setup, so it is installed explicitly rather than
      # assumed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install html5lib
        run: python3 -m pip install --quiet html5lib

      - name: HTML validation and duplicate-title check
        run: python3 tests/check-html.py

      # The docs name flags, subcommands and shipped paths that live in the
      # sibling repos. Checkout them so tests/check-ground-truth.py can read the
      # other side of every claim; it SKIPs (rather than passing vacuously) when
      # they are absent, which is why this is a separate step from the rest.
      - name: Checkout shani-deploy and shani-settings
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-deploy
          path: shani-deploy
      - name: Checkout shani-settings
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-settings
          path: shani-settings

      - name: Ground-truth check (flags, subcommands, shipped paths)
        run: python3 tests/check-ground-truth.py

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets
    needs: build
