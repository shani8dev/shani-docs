<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shanios Docs</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <link rel="manifest" href="/manifest.json">
  <script>
    // GitHub Pages SPA redirect — rewrite 404 paths back to index.html
    // preserving the path, query string, and hash so the SPA router can restore them.
    (function () {
      var ua = navigator.userAgent || '';
      // FIX G: broader bot regex catches Google-InspectionTool and other Google crawlers
      // FIX H: anthropic-ai and ChatGPT-User carry neither "bot" nor "crawler"/"spider" in
      // their UA string, so the regex below used to miss them entirely — and robots.txt's
      // own `Disallow: /*?p=` then trapped them on the very redirect this file sends
      // unrecognized visitors to. Both are explicitly welcomed in robots.txt, so they must
      // be recognized here too.
      var isBot = /bot|crawler|spider|google|bingbot|yandex|baidu|facebookexternalhit|twitterbot|linkedinbot|slackbot|anthropic-ai|chatgpt-user/i.test(ua);

      // NEVER redirect search bots — let them see the real 404
      if (isBot) return;

      var l = window.location;
      var path   = l.pathname;
      var search = l.search ? l.search.slice(1) : '';
      var hash   = l.hash   ? l.hash.slice(1)   : '';
      // Normalise legacy /docs/<slug> → /doc/<slug>
      var docMatch = path.match(/^\/docs\/(.+?)(?:\.md)?\/?$/);
      if (docMatch) path = '/doc/' + docMatch[1];
      var redirect = l.protocol + '//' + l.hostname +
        (l.port ? ':' + l.port : '') + '/' +
        '?p=' + encodeURIComponent(path) +
        (search ? '&q=' + encodeURIComponent(search) : '') +
        (hash   ? '&h=' + encodeURIComponent(hash)   : '');
      l.replace(redirect);
    })();
  </script>
  <script>
    (function () {
      try {
        var pfx = (typeof CONFIG !== 'undefined' && CONFIG.STORAGE_PREFIX)
                    ? CONFIG.STORAGE_PREFIX + '_'
                    : 'shanidocs_';
        var t = localStorage.getItem(pfx + 'theme') ||
                (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <noscript>
    <div style="text-align:center;padding:4rem 2rem;font-family:sans-serif">
      <strong>JavaScript is required to view this wiki.</strong>
    </div>
  </noscript>
</body>
</html>
